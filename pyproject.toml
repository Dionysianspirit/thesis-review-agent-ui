[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-review"
version = "0.7.0"
description = "本科毕业论文教师审稿助手"
requires-python = ">=3.12"
dependencies = [
    "python-docx==1.2.0",
    "pywebview>=5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pyinstaller>=6",
]

[project.scripts]
thesis-review = "thesis_review.cli:main"
thesis-review-gui = "thesis_review.gui.app:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
thesis_review = ["gui/*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
